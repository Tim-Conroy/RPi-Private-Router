#!/usr/sbin/nft -f
# /etc/nftables.conf — example Raspberry Pi router ruleset WITH WireGuard
# Lines marked  ### WG  are the WireGuard additions. If you already have a
# ruleset, copy only those lines into your existing chains (adding a second
# table won't work if your existing forward/input policy is drop).
#
# Apply:  sudo nft -c -f /etc/nftables.conf   (check syntax first)
#         sudo systemctl restart nftables

flush ruleset

define WAN     = "eth0"    # internet side
define LAN     = "wlan0"   # your hostapd interface (or br0 if you bridge)
define WG      = "wg0"     ### WG
define WG_PORT = 51820     ### WG

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, ipv6-icmp } accept

        iifname $LAN accept                         # LAN may reach the Pi (SSH, DHCP, DNS, Pi-hole web UI)
        iifname $WG accept                          ### WG  VPN clients get the same trust as LAN
        iifname $WAN udp dport $WG_PORT accept      ### WG  the ONLY port open to the internet
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname $LAN oifname $WAN accept            # LAN -> internet
        iifname $WG  oifname $WAN accept            ### WG  VPN clients -> internet
        iifname $WG  oifname $LAN accept            ### WG  VPN clients -> home devices (remove if not wanted)
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN masquerade                     # covers both LAN and VPN subnets
    }
}
