#!/usr/sbin/nft -f
# /etc/nftables.conf — RPi Private Router, travel VPN (WireGuard CLIENT) with kill switch
#
# Private-network devices (wlan1) may reach the internet ONLY through the
# WireGuard tunnel (wg0). If the tunnel drops, their traffic is blocked
# instead of leaking out over Starlink or campground Wi-Fi.
#
# Captive portals: `sudo travel-vpn off` adds one "accept" rule to the
# direct_access chain so you can log in; `sudo travel-vpn on` empties it again.
#
# Apply:  sudo nft -c -f /etc/nftables.conf   (check syntax first)
#         sudo systemctl restart nftables
#
# This file only resets its own two tables, so the rules wg-quick adds for
# the tunnel survive a reload. A reload always turns the kill switch back ON.

destroy table inet filter
destroy table ip nat

define WAN = "wlan0"   # upstream: Starlink router Wi-Fi, campground or hotel Wi-Fi
define LAN = "wlan1"   # private network: the hostapd access point
define WG  = "wg0"     # WireGuard tunnel to your VPN provider or home server

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, ipv6-icmp } accept

        iifname $LAN accept      # private network may reach the Pi: SSH, DHCP, DNS, Pi-hole web UI
        # Nothing is accepted from wlan0 or wg0: no open ports to the outside world.
    }

    # KILL SWITCH. Empty = devices can NOT bypass the tunnel (the default, and after every reboot).
    # `travel-vpn off` puts a single "accept" here for captive-portal logins.
    chain direct_access {
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname $LAN oifname $WG  accept              # private network -> tunnel: always allowed
        iifname $LAN oifname $WAN jump direct_access  # private network -> straight out: only in portal mode
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WG  masquerade   # devices appear as the Pi's tunnel address
        oifname $WAN masquerade   # used only in portal mode
    }
}
